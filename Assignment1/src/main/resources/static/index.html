<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Speech-to-Text</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		
		<main>
		<h1>Speech-To-Text</h1>
		
		<p id="status" role="status" aria-live="polite" aria-atomic="true">Please press Start Recording to begin.</p>
		
		<button id="startButton" type="button">Start Recording</button>
		<button id="stopButton" type="button" disabled>Stop Recording</button>
		
		<section aria-labelledby="transcriptionHeading">
			<h2 id="transcriptionHeading">
				Transcription
			</h2>
			
			<p id="transcription" aria-live="polite" aria-atomic="true">The transcription of your audio will appear here.</p>
			
		</section>
		</main>

				<script src="script.js"></script>
	</body>
</html>
